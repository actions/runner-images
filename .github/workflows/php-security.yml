name: PHP security validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'images/**/scripts/**/php-security.sh'
      - 'images/**/scripts/**/install-php.sh'
      - 'images/windows/scripts/build/Install-PHP.ps1'
      - 'images/windows/scripts/helpers/PhpSecurity.Helpers.psm1'
      - 'images/windows/scripts/helpers/ImageHelpers.psm1'
      - 'byoi/scripts/**/php-security.sh'
      - 'byoi/scripts/build/install-php.sh'
      - 'tests/test_php_security.py'
      - 'tests/php-security/**'
      - '.github/workflows/php-security.yml'

permissions:
  contents: read

jobs:
  php-security:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate Linux package and macOS release policies
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -p test_php_security.py -v
      - name: Validate Windows release policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-Pester -Path tests/php-security -Output Detailed -CI
